name: PBR exact admission v2
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rational-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python scripts/budget_v2.py --package pbr-correctness --reserve-seconds 900
      - run: python validation/pbr_reference_v2.py
      - name: Build independent event-driven extended engine
        run: |
          mkdir -p artifacts/build
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -Ivendor engines/des_ext/main.cpp -o artifacts/build/des-ext
      - name: Fetch pinned original S1
        env:
          TSFG_SOURCE_SSH_KEY: ${{ secrets.TSFG_SOURCE_SSH_KEY }}
        run: python scripts/fetch_tsfg.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false
      - run: python scripts/build_tsfg.py --upstream-test-evidence docs/results/mk01/tsfg-provenance.json
      - run: python validation/pbr_des_v2.py --tsfg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-rational-controls
          path: |
            artifacts/pbr-reference/
            artifacts/pbr-des/
            artifacts/build/
            artifacts/budget/
