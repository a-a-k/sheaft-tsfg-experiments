name: APS remaining million matrix v2
on:
  workflow_dispatch:
    inputs:
      batch:
        type: choice
        options: ['0','1','2','3','4','5']
        required: true
      previous_runs:
        type: string
        default: '36309782620'
        required: true
      inputs_run:
        type: string
        default: '36309476853'
      admission_run:
        type: string
        default: '36307972828'
permissions:
  contents: read
  actions: read
jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
      BATCH: ${{ inputs.batch || '0' }}
      PREVIOUS_RUNS: ${{ inputs.previous_runs || '36309782620' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python scripts/budget_v2.py --package aps-rest --reserve-seconds 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aps-inputs-index-1m
          run-id: ${{ inputs.inputs_run || '36309476853' }}
          github-token: ${{ github.token }}
          path: batch
      - id: plan
        run: python scripts/aps_remaining_v2.py --batch "$BATCH" --previous-runs "$PREVIOUS_RUNS"
      - env:
          RESERVED: ${{ steps.plan.outputs.reservation }}
        run: python scripts/budget_v2.py --package aps-rest --reserve-seconds "$RESERVED"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aps-remaining-manifest
          path: |
            batch/
            artifacts/budget/
  measure:
    needs: batch
    if: needs.batch.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ 50 }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.batch.outputs.matrix) }}
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      PHASE: million
      TASK: ${{ matrix.task }}
      REPEAT: ${{ matrix.repeat }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aps-inputs-${{ '1m' }}
          run-id: ${{ inputs.inputs_run || '36309476853' }}
          github-token: ${{ github.token }}
          path: aps-inputs
      - name: Isolated complete planning process
        run: |
          if [ "$PHASE" = diagnostic ]; then file=diagnostic-10k.jsonl; limit=60; elif [ "$PHASE" = million ]; then file=task.jsonl; limit=2700; else file=task.jsonl; limit=180; fi
          python scripts/run_aps_v2.py --input "aps-inputs/$TASK/$file" --output result --limit "$limit" --repeat "$REPEAT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aps-measured-${{ matrix.task }}
          path: result/
          compression-level: 1
  validate:
    needs: [batch, measure]
    if: always() && needs.batch.result == 'success' && needs.batch.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ 8 }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.batch.outputs.matrix) }}
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      PHASE: million
      TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aps-inputs-${{ '1m' }}
          run-id: ${{ inputs.inputs_run || '36309476853' }}
          github-token: ${{ github.token }}
          path: aps-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aps-admission-and-public-build
          run-id: ${{ inputs.admission_run || '36307972828' }}
          github-token: ${{ github.token }}
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aps-measured-${{ matrix.task }}
          path: result
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Independent constraints, quality bound and DAG replay
        run: |
          chmod +x artifacts/build/simulator
          if [ "$PHASE" = diagnostic ]; then file=diagnostic-10k.jsonl; else file=task.jsonl; fi
          python scripts/aps_batch_v2.py validate --root result --task "aps-inputs/$TASK/$file"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aps-validated-${{ matrix.task }}
          path: |
            result/validated.json
            result/validation/quality.json
            result/validation/replay/
          compression-level: 1
  report:
    needs: [batch, validate]
    if: always() && needs.batch.result == 'success' && needs.batch.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: aps-validated-*
          path: collected
      - env:
          EXPECTED: ${{ needs.batch.outputs.count }}
        run: python scripts/aps_batch_v2.py report --root collected --output report --expected "$EXPECTED"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aps-batch-report
          path: report/
