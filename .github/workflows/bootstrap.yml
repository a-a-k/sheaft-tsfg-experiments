name: Bootstrap pinned environment
on:
  workflow_dispatch:
  push:
    paths:
      - requirements.in
      - scripts/lock_environment.py
      - .github/workflows/bootstrap.yml
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --memory=4g --memory-swap=4g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve and preserve exact dependencies
        run: python scripts/lock_environment.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pinned-environment
          path: |
            artifacts/bootstrap/requirements.lock
            artifacts/bootstrap/sources.json
            artifacts/bootstrap/compiler.txt
            artifacts/bootstrap/mk01.txt
            artifacts/bootstrap/json.hpp
          retention-days: 90
