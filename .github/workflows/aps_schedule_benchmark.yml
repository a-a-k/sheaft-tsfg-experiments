name: APS BASIC scheduling v2
on:
  push:
    branches: ['implementation/revision-v2']
    paths: ['.github/workflows/aps_schedule_benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python scripts/budget_v2.py --package aps-first --reserve-seconds 1980
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aps-budget-${{ github.sha }}
          path: artifacts/budget/
  prepare:
    needs: budget
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Convert all historical 100k routes; deduplicate semantic hashes
        run: python scripts/prepare_aps_v2.py --size 100000 --output artifacts/aps-inputs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aps-inputs-100k
          path: artifacts/aps-inputs/
          compression-level: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aps-inputs-index-100k
          path: artifacts/aps-inputs/aps-inputs-index.json
  correctness:
    needs: budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/build.py
      - run: python validation/scale_core.py --engines dag des
      - run: python validation/aps_memory.py
      - run: python validation/aps_schedule.py --admission --output artifacts/aps-admission
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aps-admission-and-public-build
          path: |
            artifacts/aps-admission/
            artifacts/build/
