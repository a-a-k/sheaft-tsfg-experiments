name: Independent reserve holdout v2
on:
  push:
    branches: ['implementation/revision-v2']
    paths: ['.github/workflows/reserve_holdout_v2.yml']
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [pilot]
        default: pilot
      size:
        type: choice
        options: ['10000','100000']
        default: '10000'
      f1_run:
        type: string
        default: '36311760421'
      f2_run:
        type: string
        default: '36312122851'
permissions:
  contents: read
  actions: read
jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python scripts/budget_v2.py --package reserves --reserve-seconds 2580
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reserve-budget
          path: artifacts/budget/
  pilot:
    needs: budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        family: [F1,F2]
        law: [independent,common-cause]
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
      FAMILY: ${{ matrix.family }}
      LAW: ${{ matrix.law }}
      SIZE: ${{ inputs.size || '10000' }}
      BASELINE_RUN: ${{ matrix.family == 'F1' && (inputs.f1_run || '36311760421') || (inputs.f2_run || '36312122851') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python scripts/fetch_reserve_baseline_v2.py --run "$BASELINE_RUN" --family "$FAMILY" --size "$SIZE"
      - run: mkdir -p artifacts/build && g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -Ivendor engines/des_ext/main.cpp -o artifacts/build/des-ext
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python experiments/reserve_pilot_v2.py --law "$LAW"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reserve-pilot-${{ matrix.family }}-${{ matrix.law }}
          path: |
            pilot/
            baseline/
          compression-level: 1
