name: Revision v2 evidence report
on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        options: [first-package, final-package]
        default: first-package
      checks_only:
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.checks_only && 5 || inputs.package == 'final-package' && 30 || 12 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - env:
          RESERVATION: ${{ inputs.checks_only && 300 || inputs.package == 'final-package' && 2400 || 1320 }}
        run: python scripts/budget_v2.py --package flow-report --reserve-seconds "$RESERVATION"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: inputs.package == 'final-package'
        with:
          python-version: '3.12'
      - if: inputs.package == 'final-package'
        run: python -m pip install --require-hashes -r requirements.lock
      - if: inputs.package == 'final-package'
        run: python scripts/install_stats_v2.py
      - if: inputs.package == 'final-package'
        run: python -m compileall -q scripts experiments validation references planning
      - if: inputs.package == 'final-package'
        run: python validation/revision_statistics_v2.py && python validation/reserve_stats_v2.py
      - if: inputs.package == 'final-package' && !inputs.checks_only
        run: python scripts/final_evidence_v2.py
      - if: inputs.package != 'final-package' && !inputs.checks_only
        run: python scripts/first_package_v2.py
      - if: ${{ !inputs.checks_only }}
        env:
          ROOT: ${{ inputs.package || 'first-package' }}
          REPORT: ${{ inputs.package == 'final-package' && 'FINAL_REPORT_RU.md' || 'FIRST_PACKAGE_REPORT_RU.md' }}
        run: python scripts/publish_revision_bundle_v2.py --root "$ROOT" --kind "$ROOT" --report "$REPORT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.checks_only && 'final-checks' || inputs.package || 'first-package' }}-public-report
          path: |
            first-package/report/
            final-package/report/
            artifacts/budget/
  verify:
    needs: report
    if: ${{ !inputs.checks_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - env:
          KIND: ${{ inputs.package || 'first-package' }}
        run: python scripts/publish_revision_bundle_v2.py --kind "$KIND" --download-verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.package || 'first-package' }}-download-verification
          path: publication/download-verification.json
