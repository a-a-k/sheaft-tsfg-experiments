name: Full million-operation control traces
on:
  push:
    branches: ['implementation/full-study']
    paths: ['.github/workflows/witness.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        family: [F1,F2]
        density: [DENSE,SPARSE]
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-screen-${{ matrix.family }}-${{ matrix.density }}-1000000-101-r0
          run-id: 36234413565
          github-token: ${{ github.token }}
          path: reference
      - name: Fetch pinned unchanged S1
        env:
          TSFG_SOURCE_SSH_KEY: ${{ secrets.TSFG_SOURCE_SSH_KEY }}
        run: python scripts/fetch_tsfg.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/build_tsfg.py --upstream-test-evidence docs/results/mk01/tsfg-provenance.json
      - run: python scripts/build.py
      - run: python validation/core.py
      - run: python experiments/witness.py --family ${{ matrix.family }} --density ${{ matrix.density }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: witness-${{ matrix.family }}-${{ matrix.density }}
          path: artifacts/
          compression-level: 1
          retention-days: 90
