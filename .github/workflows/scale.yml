name: Scale calibration and screen
on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
      part:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [calibration, screen, main]
        default: calibration
      part:
        description: 'screen: 0..5; main: 0..8; calibration: 0'
        type: string
        default: '0'
permissions:
  contents: read
concurrency:
  group: scale-${{ inputs.suite || 'calibration' }}-${{ inputs.part || '0' }}
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Matrix
        id: matrix
        env:
          SUITE: ${{ inputs.suite || 'calibration' }}
          PART: ${{ inputs.part || '0' }}
        run: |
          python - <<'PY'
          import itertools,json,os
          suite,part=os.environ['SUITE'],int(os.environ['PART'])
          if suite=='calibration':
              rows=[dict(n=n,family=f,density='DENSE',seed=901,round=0,k=10) for n,f in itertools.product([1000,10000,100000,1000000],['F1','F2'])]
          elif suite=='screen':
              rows=[dict(n=n,family=f,density=d,seed=s,round=0,k=10) for n,f,d,s in itertools.product([1000,10000,100000,1000000],['F1','F2'],['DENSE','SPARSE'],[101,102,103])]
              rows=rows[part*8:(part+1)*8]
          else:
              rows=[dict(n=n,family=f,density=d,seed=s,round=r,k=100) for n,f,d,s,r in itertools.product([100000,1000000],['F1','F2'],['DENSE','SPARSE'],[101,102,103],[0,1,2])]
              rows=rows[part*8:(part+1)*8]
          assert rows
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':rows})+'\n')
          PY
      - name: Fetch pinned private source
        env:
          TSFG_SOURCE_SSH_KEY: ${{ secrets.TSFG_SOURCE_SSH_KEY }}
        run: python scripts/fetch_tsfg.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/build_tsfg.py --upstream-test-evidence docs/results/mk01/tsfg-provenance.json
      - run: python scripts/build.py
      - run: python validation/core.py
      - run: python validation/scale_core.py
      - run: python validation/replay_core.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scale-admission-${{ inputs.suite || 'calibration' }}-${{ inputs.part || '0' }}
          path: artifacts/
  measure:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.admission.outputs.matrix) }}
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scale-admission-${{ inputs.suite || 'calibration' }}-${{ inputs.part || '0' }}
          path: admission
      - name: Fetch pinned private source
        env:
          TSFG_SOURCE_SSH_KEY: ${{ secrets.TSFG_SOURCE_SSH_KEY }}
        run: python scripts/fetch_tsfg.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/build_tsfg.py --upstream-test-evidence admission/build/upstream-tests.json
      - run: python scripts/build.py
      - name: Freeze dataset and 1000 scenarios
        run: python experiments/scale_data.py --n ${{ matrix.n }} --family ${{ matrix.family }} --density ${{ matrix.density }} --seed ${{ matrix.seed }} --output artifacts/dataset
      - name: Measure standalone sequential processes
        env:
          SUITE: ${{ inputs.suite || 'calibration' }}
        run: |
          if [ "$SUITE" = main ]; then
            python experiments/scale_run.py --dataset artifacts/dataset --output artifacts/measurements --k ${{ matrix.k }} --paired --round ${{ matrix.round }} --compact-traces
          else
            python experiments/scale_run.py --dataset artifacts/dataset --output artifacts/measurements --k ${{ matrix.k }} --compact-traces
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scale-${{ inputs.suite || 'calibration' }}-${{ matrix.family }}-${{ matrix.density }}-${{ matrix.n }}-${{ matrix.seed }}-r${{ matrix.round }}
          path: artifacts/
          compression-level: 1
          retention-days: 90
  validate:
    needs: [admission, measure]
    if: always() && needs.admission.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.admission.outputs.matrix) }}
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scale-${{ inputs.suite || 'calibration' }}-${{ matrix.family }}-${{ matrix.density }}-${{ matrix.n }}-${{ matrix.seed }}-r${{ matrix.round }}
          path: artifacts
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python validation/scale_replay.py --dataset artifacts/dataset --results artifacts/measurements
      - run: python validation/scale_replay.py --dataset artifacts/dataset --results artifacts/baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validated-${{ inputs.suite || 'calibration' }}-${{ matrix.family }}-${{ matrix.density }}-${{ matrix.n }}-${{ matrix.seed }}-r${{ matrix.round }}
          path: |
            artifacts/measurements/**/measurement.json
            artifacts/measurements/validation.json
            artifacts/dataset/manifest.json
            artifacts/baseline/**/measurement.json
            artifacts/baseline/validation.json
