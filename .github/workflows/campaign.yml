name: Complete E2 campaign
on:
  push:
    branches: ['implementation/full-study']
    paths: ['.github/workflows/campaign.yml']
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [screen, main]
        default: screen
permissions:
  contents: read
concurrency:
  group: full-e2-${{ inputs.stage || 'screen' }}
  cancel-in-progress: false
jobs:
  screen:
    if: (inputs.stage || 'screen') == 'screen'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: ['0','1','2','3','4','5']
    uses: ./.github/workflows/scale.yml
    with:
      suite: screen
      part: ${{ matrix.part }}
    secrets: inherit
  main:
    if: inputs.stage == 'main'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: ['0','1','2','3','4','5','6','7','8']
    uses: ./.github/workflows/scale.yml
    with:
      suite: main
      part: ${{ matrix.part }}
    secrets: inherit
  report:
    needs: [screen, main]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: validated-${{ inputs.stage || 'screen' }}-*
          path: evidence
      - run: python experiments/scale_report.py --input evidence --output artifacts/scale-report --stage ${{ inputs.stage || 'screen' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2-${{ inputs.stage || 'screen' }}-report
          path: artifacts/scale-report
          retention-days: 90
