name: Publishable research report
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Complete E2 campaign', 'E3 exact representation and fluid aggregation', 'Supplementary BURST equipment assembly and K1000', 'G2 resource ranking agreement']
    types: [completed]
  push:
    branches: ['implementation/full-study']
    paths: ['.github/workflows/report.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: final-research-report
  cancel-in-progress: false
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect_evidence.py --output evidence --check-only
      - name: Admit evidence retrieval against the completed original-kernel audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect_evidence.py --output retrieval-check --only-role audit
      - name: Verify replay result survived checked archive retrieval
        run: python -c "import json; assert json.load(open('retrieval-check/audit/audit/ozon-reproduction-check.json'))['status']=='PASS'"
  report:
    needs: dependencies
    if: needs.dependencies.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify completed campaign evidence and archive digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect_evidence.py --output evidence
      - run: python experiments/final_report.py --evidence evidence --output artifacts/final
      - name: Preserve all 48 public input datasets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect_evidence.py --output artifacts/final --inputs
      - name: Preserve compact evidence with the report
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          shutil.make_archive('artifacts/final/evidence','zip','evidence')
          root=Path('artifacts/final')
          hashes={}
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='SHA256.json':
                  with p.open('rb') as f:hashes[p.name]=hashlib.file_digest(f,'sha256').hexdigest()
          (root/'SHA256.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-study-report
          path: artifacts/final/
          retention-days: 90
          compression-level: 1
