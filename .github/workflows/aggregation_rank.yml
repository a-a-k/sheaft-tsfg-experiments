name: G2 resource ranking agreement
on:
  push:
    branches: ['implementation/full-study']
    paths: ['.github/workflows/aggregation_rank.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        family: [F1,F2]
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: e3-admission
          run-id: 36247161084
          github-token: ${{ github.token }}
          path: admission
      - name: Require completed G2 hand arithmetic and G1 exact gate
        run: python -c "import json; assert json.load(open('admission/e3-gate/summary.json'))['status']=='PASS'"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: e4-summary-${{ matrix.family }}-e85c8fabc3370b7a77fb8b530fcddb435da39163
          run-id: 36234852274
          github-token: ${{ github.token }}
          path: reference
      - name: Fetch unchanged original S1
        env:
          TSFG_SOURCE_SSH_KEY: ${{ secrets.TSFG_SOURCE_SSH_KEY }}
        run: python scripts/fetch_tsfg.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/build_tsfg.py --upstream-test-evidence docs/results/mk01/tsfg-provenance.json
      - run: python experiments/aggregation_rank.py --family ${{ matrix.family }} --reference reference --output artifacts/g2-ranking
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g2-ranking-${{ matrix.family }}
          path: artifacts/
