name: Memory counter interpretation
on:
  push:
    branches: ['implementation/full-study']
    paths: ['.github/workflows/memory_counter.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  counter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python validation/memory_counter.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memory-counter
          path: artifacts/memory-counter/
