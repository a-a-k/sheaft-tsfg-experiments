name: PBR preliminary 36 instances v2
on:
  push:
    branches: ['implementation/revision-v2']
    paths: ['.github/workflows/extended_screen_v2.yml']
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [prepare, measure]
        default: prepare
        required: true
      inputs_run:
        type: string
      admission_run:
        type: string
      batch:
        type: choice
        options: ['0','1','2','3','4','5']
        default: '0'
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: inputs.phase == 'prepare' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python scripts/budget_v2.py --package pbr-screen --reserve-seconds 480
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/prepare_pbr_v2.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-inputs-36
          path: artifacts/pbr-inputs/
          compression-level: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-inputs-index
          path: |
            artifacts/pbr-inputs/pbr-inputs-index.json
            artifacts/budget/
  admission:
    if: inputs.phase == 'measure'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      ADMISSION_RUN: ${{ inputs.admission_run }}
      BATCH: ${{ inputs.batch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pbr-inputs-36
          run-id: ${{ inputs.inputs_run }}
          github-token: ${{ github.token }}
          path: batch
      - id: plan
        run: python scripts/pbr_batch_v2.py plan --root batch --admission-run "$ADMISSION_RUN" --batch "$BATCH"
      - run: python scripts/budget_v2.py --package pbr-screen --reserve-seconds 5040
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-batch-manifest
          path: |
            batch/batch-manifest.json
            artifacts/budget/
  screen:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.admission.outputs.matrix) }}
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pbr-inputs-36
          run-id: ${{ inputs.inputs_run }}
          github-token: ${{ github.token }}
          path: inputs
      - name: Fetch original S1; private executable stays on this runner
        env:
          TSFG_SOURCE_SSH_KEY: ${{ secrets.TSFG_SOURCE_SSH_KEY }}
        run: python scripts/fetch_tsfg.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false
      - run: python scripts/build_tsfg.py --upstream-test-evidence docs/results/mk01/tsfg-provenance.json
      - run: g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -Ivendor engines/des_ext/main.cpp -o artifacts/build/des-ext
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python experiments/pbr_screen_v2.py --input "inputs/$CASE" --output result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-screen-${{ matrix.case }}
          path: result/
          compression-level: 1
  report:
    needs: [admission, screen]
    if: always() && needs.admission.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pbr-screen-*
          path: collected
      - run: python scripts/pbr_batch_v2.py report --root collected --output report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-screen-batch-report
          path: report/
