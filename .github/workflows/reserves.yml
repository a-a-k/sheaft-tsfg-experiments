name: E4 reserves and holdout verification
on:
  push:
    branches: ['implementation/full-study']
    paths: ['.github/workflows/reserves.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch original TSFG for transformation admission
        env:
          TSFG_SOURCE_SSH_KEY: ${{ secrets.TSFG_SOURCE_SSH_KEY }}
        run: python scripts/fetch_tsfg.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/build_tsfg.py --upstream-test-evidence docs/results/mk01/tsfg-provenance.json
      - run: python scripts/build.py
      - run: python validation/core.py
      - run: python validation/extended_core.py
      - run: python experiments/reserves.py --gate --family F1 --output artifacts/e4-gate/F1
      - run: python experiments/reserves.py --gate --family F2 --output artifacts/e4-gate/F2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e4-admission
          path: artifacts/
  evaluate:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        family: [F1,F2]
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: e4-admission
          path: admission
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/build.py
      - name: Rank, freeze interventions and evaluate independent holdout
        run: python experiments/reserves.py --family ${{ matrix.family }} --output artifacts/e4/${{ matrix.family }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e4-${{ matrix.family }}-${{ github.sha }}
          path: artifacts/
          compression-level: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e4-summary-${{ matrix.family }}-${{ github.sha }}
          path: |
            artifacts/e4/${{ matrix.family }}/summary.json
            artifacts/e4/${{ matrix.family }}/REPORT_RU.md
            artifacts/e4/${{ matrix.family }}/ranking.json
            artifacts/e4/${{ matrix.family }}/frozen-interventions.json
            artifacts/e4/${{ matrix.family }}/dataset-metadata.json
