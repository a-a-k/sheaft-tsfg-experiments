name: Supplementary BURST equipment assembly and K1000
on:
  push:
    branches: ['implementation/full-study']
    paths: ['.github/workflows/extras.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  series:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {suite: burst, part: '0'}
          - {suite: burst, part: '1'}
          - {suite: burst, part: '2'}
          - {suite: growth, part: '0'}
          - {suite: growth, part: '1'}
          - {suite: assembly, part: '0'}
          - {suite: assembly, part: '1'}
          - {suite: extra, part: '0'}
          - {suite: extra, part: '1'}
    uses: ./.github/workflows/scale.yml
    with:
      suite: ${{ matrix.suite }}
      part: ${{ matrix.part }}
    secrets: inherit
