name: Core correctness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    # This is the complete legacy simulation campaign, not a lightweight check.
    # Publication must not silently rerun it outside the v2.2 package budgets.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned private TSFG source (read only)
        env:
          TSFG_SOURCE_SSH_KEY: ${{ secrets.TSFG_SOURCE_SSH_KEY }}
        run: python scripts/fetch_tsfg.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Censored-time report arithmetic
        run: python validation/report_core.py
      - name: Parse all public Python entrypoints
        run: python -m compileall -q experiments validation scripts references
      - name: Reuse verified unchanged upstream and build current adapter
        run: python scripts/build_tsfg.py --upstream-test-evidence docs/results/mk01/tsfg-provenance.json
      - name: Build independent C++ kernels
        run: python scripts/build.py
      - name: E0-core
        run: python validation/core.py
      - name: E2 generator and binary input admission
        run: python validation/scale_core.py
      - name: E2 independent replay admission controls
        run: python validation/replay_core.py
      - name: E0-extended
        run: python validation/extended_core.py
      - name: E3 shared types, observers and fluid conservation
        run: python validation/aggregation_core.py
      - name: Freeze Mk01 schedule and scenarios
        run: python experiments/mk01.py
      - name: Mk01 complete campaign and report
        run: python experiments/campaign.py
      - name: E1X extended campaign
        run: python experiments/extended_campaign.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-${{ github.sha }}
          path: artifacts/
          retention-days: 90
