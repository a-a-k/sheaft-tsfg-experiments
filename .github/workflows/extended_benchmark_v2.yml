name: PBR large admission and measurements v2
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [prepare, nominal, pilot, measure]
        default: prepare
        required: true
      size:
        type: choice
        options: ['100000','1000000']
        default: '100000'
      inputs_run:
        type: string
      admission_run:
        type: string
        default: '36310562250'
      nominal_run:
        type: string
      pilot_run:
        type: string
      family:
        type: choice
        options: [F1,F2]
        default: F1
      round:
        type: choice
        options: ['0','1','2','3']
        default: '0'
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: inputs.phase == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
      SIZE: ${{ inputs.size || '100000' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python scripts/budget_v2.py --package pbr-large --reserve-seconds 1200
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/prepare_pbr_v2.py --size "$SIZE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-large-inputs
          path: artifacts/pbr-inputs/
          compression-level: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-large-inputs-index
          path: |
            artifacts/pbr-inputs/pbr-inputs-index.json
            artifacts/budget/
  gate:
    if: inputs.phase == 'nominal'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      ADMISSION_RUN: ${{ inputs.admission_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pbr-large-inputs
          run-id: ${{ inputs.inputs_run }}
          github-token: ${{ github.token }}
          path: batch
      - id: plan
        run: python scripts/pbr_batch_v2.py plan --root batch --admission-run "$ADMISSION_RUN" --batch 0 --reservation 9540
      - run: python scripts/budget_v2.py --package pbr-large --reserve-seconds 9540
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-large-nominal-gate
          path: |
            batch/batch-manifest.json
            artifacts/budget/
  nominal:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pbr-large-inputs
          run-id: ${{ inputs.inputs_run }}
          github-token: ${{ github.token }}
          path: inputs
      - env:
          TSFG_SOURCE_SSH_KEY: ${{ secrets.TSFG_SOURCE_SSH_KEY }}
        run: python scripts/fetch_tsfg.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false
      - run: python scripts/build_tsfg.py --upstream-test-evidence docs/results/mk01/tsfg-provenance.json
      - run: g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -Ivendor engines/des_ext/main.cpp -o artifacts/build/des-ext
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python experiments/pbr_nominal_v2.py --input "inputs/$CASE" --output result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-nominal-${{ matrix.case }}
          path: result/
          compression-level: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-nominal-admission-${{ matrix.case }}
          path: result/nominal-admission.json
  batch:
    if: inputs.phase == 'pilot' || inputs.phase == 'measure'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
      PHASE: ${{ inputs.phase }}
      FAMILY: ${{ inputs.family }}
      ROUND: ${{ inputs.round }}
      NOMINAL: ${{ inputs.nominal_run }}
      PILOT: ${{ inputs.pilot_run || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: plan
        run: python scripts/pbr_large_batch_v2.py plan --root batch --phase "$PHASE" --family "$FAMILY" --round "$ROUND" --nominal-run "$NOMINAL" --pilot-run "$PILOT"
      - env:
          RESERVED: ${{ steps.plan.outputs.reservation }}
        run: python scripts/budget_v2.py --package pbr-large --reserve-seconds "$RESERVED"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-large-measurement-gate
          path: |
            batch/
            artifacts/budget/
  measure:
    needs: batch
    if: needs.batch.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.phase == 'pilot' && 13 || 28 }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.batch.outputs.matrix) }}
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    env:
      COUNT: ${{ inputs.phase == 'pilot' && 10 || 100 }}
      ROUND: ${{ inputs.round }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pbr-nominal-${{ matrix.case }}
          run-id: ${{ inputs.nominal_run }}
          github-token: ${{ github.token }}
          path: input
      - env:
          TSFG_SOURCE_SSH_KEY: ${{ secrets.TSFG_SOURCE_SSH_KEY }}
        run: python scripts/fetch_tsfg.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
          cache: false
      - run: python scripts/build_tsfg.py --upstream-test-evidence docs/results/mk01/tsfg-provenance.json
      - run: g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -Ivendor engines/des_ext/main.cpp -o artifacts/build/des-ext
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python experiments/pbr_measure_v2.py --input input --output result --count "$COUNT" --round "$ROUND"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-measured-${{ matrix.case }}
          path: |
            result/measurements.json
            result/environment.json
            result/*/*.json
            result/*/*.jsonl.gz
            result/*/*.txt
          compression-level: 0
  validate:
    needs: [batch, measure]
    if: always() && needs.batch.result == 'success' && needs.batch.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.phase == 'pilot' && 8 || 15 }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.batch.outputs.matrix) }}
    container:
      image: python:3.12-bookworm@sha256:dbbe4ceb97851e2e5fa83798b239811f871cb743b259ba3563737349f6bcfaa0
      options: --cpus=1 --cpuset-cpus=0 --memory=4g --memory-swap=4g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pbr-nominal-${{ matrix.case }}
          run-id: ${{ inputs.nominal_run }}
          github-token: ${{ github.token }}
          path: input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pbr-measured-${{ matrix.case }}
          path: measured
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python validation/pbr_large_v2.py --input input --measured measured --output validated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-validated-${{ matrix.case }}
          path: validated/
          compression-level: 0
  report:
    needs: [batch, validate]
    if: always() && needs.batch.result == 'success' && needs.batch.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pbr-validated-*
          path: collected
      - env:
          EXPECTED: ${{ needs.batch.outputs.count }}
        run: python scripts/pbr_large_batch_v2.py report --root collected --output report --expected "$EXPECTED"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pbr-large-batch-report
          path: report/
